<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Para Daniela 💘</title>
  <style>
    body {
      background: linear-gradient(135deg, #ff758c, #ff7eb3);
      font-family: 'Arial', sans-serif;
      text-align: center;
      color: white;
      height: 100vh;
      margin: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    h1 {
      font-size: 3em;
    }

    p {
      font-size: 1.3em;
      margin-bottom: 30px;
    }

    button {
      padding: 15px 35px;
      font-size: 1.2em;
      border: none;
      border-radius: 15px;
      margin: 10px;
      cursor: pointer;
    }

    #yes {
      background-color: #ff2e63;
      color: white;
    }

    #no {
      background-color: #444;
      color: white;
      position: absolute;
    }

    .heart {
      position: absolute;
      color: red;
      font-size: 20px;
      animation: float 4s infinite;
    }

    @keyframes float {
      0% { transform: translateY(0); opacity: 1; }
      100% { transform: translateY(-800px); opacity: 0; }
    }
  </style>
</head>
<body>

  <h1>Daniela 💕</h1>
  <p>Desde que llegaste a mi vida todo es más bonito…</p>
  <h1>¿Quieres ser mi San Valentín? 💘</h1>

  <button id="yes" onclick="accept()">Sí, obvio 💖</button>
  <button id="no" onmouseover="moveNo()">No 😢</button>

  <script>
    function accept() {
      document.body.innerHTML = `
        <h1>TE AMO MI AMOR 😍💖</h1>
        <p>Gracias por hacerme tan feliz.</p>
        <p>Amor mío,
desde que llegaste a mi vida todo tiene más color, más sentido y más razón. Gracias por ser mi paz, mi risa y mi lugar favorito. No necesito un día especial para amarte, pero hoy quiero recordarte que te elijo siempre. Feliz San Valentín, mi vida..</p>
        <h2>Feliz San Valentín 💘</h2>
      `;
      for(let i=0;i<50;i++) createHeart();
    }

    function moveNo() {
      const noBtn = document.getElementById("no");
      const x = Math.random() * (window.innerWidth - 100);
      const y = Math.random() * (window.innerHeight - 50);
      noBtn.style.left = x + "px";
      noBtn.style.top = y + "px";
    }

    function createHeart() {
      const heart = document.createElement("div");
      heart.className = "heart";
      heart.innerHTML = "❤️";
      heart.style.left = Math.random() * 100 + "vw";
      heart.style.bottom = "0px";
      heart.style.fontSize = (20 + Math.random()*30) + "px";
      document.body.appendChild(heart);

      setTimeout(() => {
        heart.remove();
      }, 4000);
    }
  </script>

</body>
</html>
